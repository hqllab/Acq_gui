[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acq-gui"
version = "0.1.0"
description = "Acquisition GUI"
requires-python = ">=3.10,<3.13"

dependencies = [
    "numpy<2",
    "PySide6>=6.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
